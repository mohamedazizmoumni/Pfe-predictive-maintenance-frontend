<svg
  viewBox="0 0 400 300"
  class="twin-svg"
  [class.mode-wireframe]="viewMode === 'wireframe'"
  [class.mode-xray]="viewMode === 'xray'"
  [class.mode-exploded]="viewMode === 'exploded'"
  [class.mode-crosssection]="viewMode === 'crossSection'"
  [class.mode-heatmap]="heatmapOn || viewMode === 'thermal'"
  [class.is-running]="isRunning"
  role="img"
  aria-label="Machine digital twin illustration"
>
  <defs>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313c52"/>
      <stop offset="50%" stop-color="#1b2434"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43506b"/>
      <stop offset="100%" stop-color="#232d41"/>
    </linearGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c5872"/>
      <stop offset="100%" stop-color="#28324a"/>
    </linearGradient>
    <linearGradient id="glassScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1c30"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--part-color, #9ca3af)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--part-color, #9ca3af)" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Reusable sub-parts. Must live inside <svg> so Angular's template
       schema-checker recognizes circle/path/line as SVG elements even
       though they're only stamped out via ngTemplateOutlet below. -->
  <ng-template #rotorTpl let-cx="cx" let-cy="cy" let-r="r">
    <g class="rotor" [class.rotor--spin]="isRunning" [style.transform-origin]="cx + 'px ' + cy + 'px'">
      <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r" fill="#0a0f1a" stroke="var(--part-color)" stroke-width="1.6"/>
      <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r" fill="url(#hubGlow)" opacity="0.55"/>
      <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r * 0.32" fill="var(--part-color)" opacity="0.9"/>
      <line [attr.x1]="cx" [attr.y1]="cy - r + 2" [attr.x2]="cx" [attr.y2]="cy - r * 0.45" stroke="var(--part-color)" stroke-width="2" stroke-linecap="round"/>
      <line [attr.x1]="cx" [attr.y1]="cy + r * 0.45" [attr.x2]="cx" [attr.y2]="cy + r - 2" stroke="var(--part-color)" stroke-width="2" stroke-linecap="round"/>
      <line [attr.x1]="cx - r + 2" [attr.y1]="cy" [attr.x2]="cx - r * 0.45" [attr.y2]="cy" stroke="var(--part-color)" stroke-width="2" stroke-linecap="round"/>
      <line [attr.x1]="cx + r * 0.45" [attr.y1]="cy" [attr.x2]="cx + r - 2" [attr.y2]="cy" stroke="var(--part-color)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </ng-template>

  <ng-template #fanTpl let-cx="cx" let-cy="cy" let-r="r">
    <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r + 3" fill="#0a0f1a" stroke="var(--part-color)" stroke-width="1.4"/>
    <g class="fan" [class.fan--spin]="isRunning" [style.transform-origin]="cx + 'px ' + cy + 'px'">
      <path [attr.d]="'M' + cx + ' ' + cy + ' L' + cx + ' ' + (cy - r) + ' Q' + (cx + r * 0.55) + ' ' + (cy - r * 0.55) + ' ' + cx + ' ' + cy + ' Z'" fill="var(--part-color)" opacity="0.85"/>
      <path [attr.d]="'M' + cx + ' ' + cy + ' L' + (cx + r) + ' ' + cy + ' Q' + (cx + r * 0.55) + ' ' + (cy + r * 0.55) + ' ' + cx + ' ' + cy + ' Z'" fill="var(--part-color)" opacity="0.7"/>
      <path [attr.d]="'M' + cx + ' ' + cy + ' L' + cx + ' ' + (cy + r) + ' Q' + (cx - r * 0.55) + ' ' + (cy + r * 0.55) + ' ' + cx + ' ' + cy + ' Z'" fill="var(--part-color)" opacity="0.85"/>
      <path [attr.d]="'M' + cx + ' ' + cy + ' L' + (cx - r) + ' ' + cy + ' Q' + (cx - r * 0.55) + ' ' + (cy - r * 0.55) + ' ' + cx + ' ' + cy + ' Z'" fill="var(--part-color)" opacity="0.7"/>
    </g>
  </ng-template>

  <ng-template #ledTrioTpl let-x="x" let-y="y" let-gap="gap">
    <circle [attr.cx]="x" [attr.cy]="y" r="3.4" class="led led--a"/>
    <circle [attr.cx]="x + gap" [attr.cy]="y" r="3.4" class="led led--b"/>
    <circle [attr.cx]="x + gap * 2" [attr.cy]="y" r="3.4" class="led led--c"/>
  </ng-template>

  <ng-template #gaugeTpl let-cx="cx" let-cy="cy" let-r="r">
    <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r" fill="url(#glassScreen)" stroke="var(--border-bright)" stroke-width="1.2"/>
    <circle [attr.cx]="cx" [attr.cy]="cy" [attr.r]="r - 3" fill="none" stroke="var(--accent-amber)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line class="gauge-needle" [attr.x1]="cx" [attr.y1]="cy" [attr.x2]="cx + r * 0.6" [attr.y2]="cy - r * 0.4" stroke="var(--accent-amber)" stroke-width="1.6" stroke-linecap="round" [style.transform-origin]="cx + 'px ' + cy + 'px'"/>
    <circle [attr.cx]="cx" [attr.cy]="cy" r="1.6" fill="var(--accent-amber)"/>
  </ng-template>

  <ellipse cx="200" cy="273" rx="148" ry="13" fill="#000" opacity="0.38" filter="url(#softGlow)"/>

  <!-- ═══════════════ CNC MACHINE ═══════════════ -->
  <ng-container *ngIf="archetype === 'cnc'">
    <g class="twin-part shell" [class.twin-part--highlighted]="isHighlighted('frame')" [ngStyle]="partStyle('frame')" (click)="onPartClick('frame')">
      <rect x="58" y="248" width="284" height="24" rx="8" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="58" y="248" width="284" height="7" rx="3.5" fill="url(#metalLight)"/>
      <rect x="86" y="150" width="188" height="98" rx="10" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2" class="explode-down"/>
      <rect x="104" y="164" width="118" height="16" rx="4" fill="#060c16" stroke="var(--border-dim)" stroke-width="0.8"/>
      <rect x="104" y="164" width="90" height="16" rx="4" fill="url(#metalLight)" opacity="0.3"/>
    </g>

    <g class="twin-part shell explode-up" [class.twin-part--highlighted]="isHighlighted('spindle')" [ngStyle]="partStyle('spindle')" (click)="onPartClick('spindle')">
      <rect x="174" y="38" width="64" height="120" rx="10" fill="url(#metalTop)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="186" y="28" width="40" height="16" rx="6" fill="url(#metalLight)" stroke="var(--border-bright)" stroke-width="1"/>
    </g>

    <g class="twin-part internal" [class.twin-part--highlighted]="isHighlighted('spindle')" [ngStyle]="partStyle('spindle')" (click)="onPartClick('spindle')">
      <rect x="190" y="118" width="34" height="44" rx="6" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.3"/>
      <ng-container *ngTemplateOutlet="rotorTpl; context: { cx: 207, cy: 176, r: 15 }"></ng-container>
      <path d="M196 166 Q191 184 196 200" fill="none" stroke="var(--accent-cyan)" stroke-width="1.6" stroke-dasharray="3 4" class="coolant-flow" opacity="0.85"/>
    </g>

    <g class="cross-section-fill">
      <rect x="148" y="178" width="100" height="56" rx="6" fill="#050a12" stroke="var(--accent-violet)" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="174" cy="206" r="9" fill="none" stroke="var(--accent-violet)" stroke-width="1.2"/>
      <circle cx="224" cy="206" r="9" fill="none" stroke="var(--accent-violet)" stroke-width="1.2"/>
    </g>

    <g class="twin-part explode-out-left" [class.twin-part--highlighted]="isHighlighted('motor')" [ngStyle]="partStyle('motor')" (click)="onPartClick('motor')">
      <rect x="54" y="176" width="40" height="66" rx="8" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.3"/>
      <ng-container *ngTemplateOutlet="rotorTpl; context: { cx: 74, cy: 209, r: 12 }"></ng-container>
    </g>

    <g class="twin-part" [class.twin-part--highlighted]="isHighlighted('coolingFan')" [ngStyle]="partStyle('coolingFan')" (click)="onPartClick('coolingFan')">
      <ng-container *ngTemplateOutlet="fanTpl; context: { cx: 254, cy: 222, r: 13 }"></ng-container>
    </g>

    <g class="twin-part shell explode-right" [class.twin-part--highlighted]="isHighlighted('controlPanel')" [ngStyle]="partStyle('controlPanel')" (click)="onPartClick('controlPanel')">
      <rect x="284" y="68" width="78" height="178" rx="12" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="296" y="88" width="54" height="70" rx="6" fill="url(#glassScreen)" stroke="var(--accent-cyan)" stroke-width="1" opacity="0.9"/>
      <line x1="302" y1="102" x2="344" y2="102" stroke="var(--accent-green)" stroke-width="1.4" opacity="0.85" class="signal-line"/>
      <line x1="302" y1="112" x2="336" y2="112" stroke="var(--accent-cyan)" stroke-width="1.2" opacity="0.6" class="signal-line"/>
      <line x1="302" y1="122" x2="340" y2="122" stroke="var(--accent-amber)" stroke-width="1.2" opacity="0.5" class="signal-line"/>
      <ng-container *ngTemplateOutlet="ledTrioTpl; context: { x: 302, y: 176, gap: 13 }"></ng-container>
    </g>
  </ng-container>

  <!-- ═══════════════ HYDRAULIC PRESS ═══════════════ -->
  <ng-container *ngIf="archetype === 'press'">
    <g class="twin-part shell" [class.twin-part--highlighted]="isHighlighted('frame')" [ngStyle]="partStyle('frame')" (click)="onPartClick('frame')">
      <rect x="70" y="252" width="260" height="22" rx="7" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="70" y="252" width="260" height="6" rx="3" fill="url(#metalLight)"/>
      <!-- hazard stripes -->
      <g opacity="0.55">
        <rect x="80" y="260" width="8" height="10" fill="#f59e0b"/>
        <rect x="96" y="260" width="8" height="10" fill="#0d1420"/>
        <rect x="112" y="260" width="8" height="10" fill="#f59e0b"/>
        <rect x="128" y="260" width="8" height="10" fill="#0d1420"/>
      </g>
      <!-- C-frame columns -->
      <rect x="96" y="70" width="26" height="182" rx="8" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="278" y="70" width="26" height="182" rx="8" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="96" y="60" width="208" height="30" rx="10" fill="url(#metalTop)" stroke="var(--border-mid)" stroke-width="1.2"/>
    </g>

    <!-- die / platen -->
    <g class="twin-part explode-down" [class.twin-part--highlighted]="isHighlighted('bearing')" [ngStyle]="partStyle('bearing')" (click)="onPartClick('bearing')">
      <rect x="130" y="196" width="140" height="20" rx="5" fill="url(#metalLight)" stroke="var(--part-color)" stroke-width="1.2"/>
      <rect x="150" y="216" width="100" height="14" rx="4" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1"/>
    </g>

    <!-- hydraulic cylinder + piston -->
    <g class="twin-part internal explode-up" [class.twin-part--highlighted]="isHighlighted('hydraulicPump')" [ngStyle]="partStyle('hydraulicPump')" (click)="onPartClick('hydraulicPump')">
      <rect x="176" y="92" width="48" height="60" rx="8" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.4"/>
      <rect class="piston-rod" x="192" y="150" width="16" height="52" fill="url(#metalLight)" stroke="var(--part-color)" stroke-width="1"/>
      <circle cx="200" cy="92" r="5" fill="var(--part-color)" opacity="0.85"/>
    </g>

    <g class="cross-section-fill">
      <rect x="182" y="98" width="36" height="48" rx="4" fill="#050a12" stroke="var(--accent-violet)" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="200" y1="102" x2="200" y2="140" stroke="var(--accent-violet)" stroke-width="1.2" stroke-dasharray="2 2"/>
    </g>

    <!-- pump unit + gauge (side) -->
    <g class="twin-part explode-out-left" [class.twin-part--highlighted]="isHighlighted('motor')" [ngStyle]="partStyle('motor')" (click)="onPartClick('motor')">
      <rect x="48" y="180" width="42" height="60" rx="8" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.3"/>
      <ng-container *ngTemplateOutlet="rotorTpl; context: { cx: 69, cy: 210, r: 11 }"></ng-container>
      <path d="M90 200 Q110 190 128 202" fill="none" stroke="var(--accent-cyan)" stroke-width="2" class="hose"/>
    </g>

    <g class="twin-part explode-right" [class.twin-part--highlighted]="isHighlighted('controlPanel')" [ngStyle]="partStyle('controlPanel')" (click)="onPartClick('controlPanel')">
      <rect x="310" y="120" width="46" height="80" rx="10" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <ng-container *ngTemplateOutlet="gaugeTpl; context: { cx: 333, cy: 146, r: 15 }"></ng-container>
      <ng-container *ngTemplateOutlet="ledTrioTpl; context: { x: 320, y: 182, gap: 10 }"></ng-container>
    </g>
  </ng-container>

  <!-- ═══════════════ INDUSTRIAL ROBOT ═══════════════ -->
  <ng-container *ngIf="archetype === 'robot'">
    <g class="twin-part shell" [class.twin-part--highlighted]="isHighlighted('frame')" [ngStyle]="partStyle('frame')" (click)="onPartClick('frame')">
      <rect x="140" y="230" width="120" height="42" rx="10" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="140" y="230" width="120" height="9" rx="4" fill="url(#metalLight)"/>
      <ng-container *ngTemplateOutlet="ledTrioTpl; context: { x: 178, y: 256, gap: 12 }"></ng-container>
    </g>

    <g class="robot-arm-group" [class.robot-arm-group--sway]="isRunning">
      <!-- base rotating joint -->
      <g class="twin-part" [class.twin-part--highlighted]="isHighlighted('motor')" [ngStyle]="partStyle('motor')" (click)="onPartClick('motor')">
        <circle cx="200" cy="222" r="20" fill="url(#metalTop)" stroke="var(--part-color)" stroke-width="1.5"/>
        <circle cx="200" cy="222" r="20" fill="url(#hubGlow)" opacity="0.4"/>
      </g>

      <!-- upper arm -->
      <g class="twin-part internal explode-up" [class.twin-part--highlighted]="isHighlighted('bearing')" [ngStyle]="partStyle('bearing')" (click)="onPartClick('bearing')">
        <rect x="190" y="120" width="26" height="100" rx="12" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.3" transform="rotate(-8 200 222)"/>
        <circle cx="198" cy="122" r="13" fill="url(#metalTop)" stroke="var(--part-color)" stroke-width="1.4"/>
      </g>

      <!-- forearm -->
      <g class="twin-part explode-right" [class.twin-part--highlighted]="isHighlighted('controlPanel')" [ngStyle]="partStyle('controlPanel')" (click)="onPartClick('controlPanel')">
        <rect x="196" y="60" width="20" height="72" rx="10" fill="url(#metalLight)" stroke="var(--border-bright)" stroke-width="1.2" transform="rotate(18 200 130)"/>
        <!-- gripper -->
        <g transform="rotate(18 200 130) translate(0 -6)">
          <rect x="192" y="42" width="14" height="20" rx="4" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.2"/>
          <rect x="180" y="36" width="8" height="16" rx="3" fill="url(#metalLight)" stroke="var(--part-color)" stroke-width="1"/>
          <rect x="210" y="36" width="8" height="16" rx="3" fill="url(#metalLight)" stroke="var(--part-color)" stroke-width="1"/>
        </g>
        <circle cx="199" cy="128" r="9" fill="url(#metalTop)" stroke="var(--part-color)" stroke-width="1.2"/>
      </g>
    </g>

    <g class="cross-section-fill">
      <circle cx="200" cy="222" r="12" fill="none" stroke="var(--accent-violet)" stroke-width="1.2" stroke-dasharray="2 2"/>
      <circle cx="198" cy="122" r="7" fill="none" stroke="var(--accent-violet)" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </ng-container>

  <!-- ═══════════════ CONVEYOR / PACKAGING LINE ═══════════════ -->
  <ng-container *ngIf="archetype === 'conveyor'">
    <g class="twin-part shell" [class.twin-part--highlighted]="isHighlighted('frame')" [ngStyle]="partStyle('frame')" (click)="onPartClick('frame')">
      <rect x="40" y="180" width="320" height="16" rx="6" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.1"/>
      <rect x="70" y="196" width="14" height="56" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1"/>
      <rect x="316" y="196" width="14" height="56" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1"/>
      <rect x="60" y="250" width="280" height="16" rx="6" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.1"/>
    </g>

    <g class="twin-part internal" [class.twin-part--highlighted]="isHighlighted('conveyorBelt')" [ngStyle]="partStyle('conveyorBelt')" (click)="onPartClick('conveyorBelt')">
      <circle cx="66" cy="188" r="15" fill="url(#metalTop)" stroke="var(--part-color)" stroke-width="1.3"/>
      <circle cx="334" cy="188" r="15" fill="url(#metalTop)" stroke="var(--part-color)" stroke-width="1.3"/>
      <rect x="66" y="174" width="268" height="28" rx="4" fill="url(#glassScreen)" stroke="var(--part-color)" stroke-width="1.1"/>
      <line class="belt-flow" x1="70" y1="188" x2="330" y2="188" stroke="var(--part-color)" stroke-width="2" stroke-dasharray="6 10" opacity="0.75"/>
      <!-- packages -->
      <rect class="belt-package" x="110" y="164" width="22" height="18" rx="3" fill="url(#metalLight)" stroke="var(--border-bright)" stroke-width="1"/>
      <rect class="belt-package belt-package--b" x="190" y="164" width="22" height="18" rx="3" fill="url(#metalLight)" stroke="var(--border-bright)" stroke-width="1"/>
      <rect class="belt-package belt-package--c" x="260" y="164" width="22" height="18" rx="3" fill="url(#metalLight)" stroke="var(--border-bright)" stroke-width="1"/>
    </g>

    <g class="cross-section-fill">
      <rect x="66" y="196" width="268" height="8" fill="none" stroke="var(--accent-violet)" stroke-width="1" stroke-dasharray="2 2"/>
    </g>

    <g class="twin-part explode-out-left" [class.twin-part--highlighted]="isHighlighted('motor')" [ngStyle]="partStyle('motor')" (click)="onPartClick('motor')">
      <rect x="18" y="170" width="36" height="52" rx="8" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.3"/>
      <ng-container *ngTemplateOutlet="rotorTpl; context: { cx: 36, cy: 196, r: 10 }"></ng-container>
    </g>

    <!-- photoeye sensor gate -->
    <g class="twin-part explode-up" [class.twin-part--highlighted]="isHighlighted('controlPanel')" [ngStyle]="partStyle('controlPanel')" (click)="onPartClick('controlPanel')">
      <rect x="264" y="130" width="8" height="46" rx="3" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.2"/>
      <rect x="128" y="130" width="8" height="46" rx="3" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.2"/>
      <line class="signal-line" x1="136" y1="150" x2="264" y2="150" stroke="var(--accent-cyan)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
      <ng-container *ngTemplateOutlet="ledTrioTpl; context: { x: 260, y: 134, gap: 8 }"></ng-container>
    </g>
  </ng-container>

  <!-- ═══════════════ GENERIC INDUSTRIAL UNIT ═══════════════ -->
  <ng-container *ngIf="archetype === 'generic'">
    <g class="twin-part shell" [class.twin-part--highlighted]="isHighlighted('frame')" [ngStyle]="partStyle('frame')" (click)="onPartClick('frame')">
      <rect x="90" y="246" width="220" height="24" rx="8" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.2"/>
      <rect x="90" y="246" width="220" height="7" rx="3.5" fill="url(#metalLight)"/>
    </g>

    <!-- vessel body -->
    <g class="twin-part internal explode-up" [class.twin-part--highlighted]="isHighlighted('bearing')" [ngStyle]="partStyle('bearing')" (click)="onPartClick('bearing')">
      <rect x="130" y="80" width="140" height="168" rx="34" fill="url(#metalBody)" stroke="var(--border-mid)" stroke-width="1.3"/>
      <ellipse cx="200" cy="80" rx="70" ry="16" fill="url(#metalTop)" stroke="var(--border-bright)" stroke-width="1.2"/>
      <rect x="150" y="110" width="100" height="10" rx="5" fill="#0d1420" opacity="0.5"/>
      <rect x="150" y="150" width="100" height="10" rx="5" fill="#0d1420" opacity="0.5"/>
      <rect x="150" y="190" width="100" height="10" rx="5" fill="#0d1420" opacity="0.5"/>
    </g>

    <g class="cross-section-fill">
      <rect x="150" y="96" width="100" height="140" rx="20" fill="none" stroke="var(--accent-violet)" stroke-width="1" stroke-dasharray="2 3"/>
      <path class="coolant-flow" d="M160 210 Q200 190 240 210" fill="none" stroke="var(--accent-cyan)" stroke-width="1.6" stroke-dasharray="3 4" opacity="0.85"/>
    </g>

    <!-- pipes -->
    <g class="twin-part explode-out-left" [class.twin-part--highlighted]="isHighlighted('motor')" [ngStyle]="partStyle('motor')" (click)="onPartClick('motor')">
      <rect x="70" y="150" width="60" height="16" rx="6" fill="url(#metalLight)" stroke="var(--part-color)" stroke-width="1.2"/>
      <rect x="56" y="140" width="18" height="36" rx="6" fill="url(#metalBody)" stroke="var(--part-color)" stroke-width="1.2"/>
