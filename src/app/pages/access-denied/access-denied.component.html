<div class="denied-shell elevated-panel">
  <p class="eyebrow section-eyebrow">Restricted</p>
  <h1>Access denied</h1>
  <p>
    Your profile does not include the roles required to open this module. Please contact an administrator to
    request <strong>{{ moduleLabel }}</strong> access.
  </p>
  <div class="actions">
    <a [routerLink]="dashboardRoute" class="btn btn-primary">Back to dashboard</a>
    <a routerLink="/auth/login" class="btn btn-ghost">Switch account</a>
  </div>
</div>
