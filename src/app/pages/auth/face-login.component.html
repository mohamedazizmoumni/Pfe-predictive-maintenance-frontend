<div class="face-shell">
  <div class="background-glow"></div>

  <div class="face-card">
    <app-face-scan-panel
      [isLoading]="isLoading"
      [apiError]="errorMessage"
      [recognizedResponse]="recognizedResponse"
      (authenticate)="onAuthenticate($event)"
      (continueClicked)="onContinue()"
      (backClicked)="onBackToLogin()"
    >
      <span footer>Having trouble? <a routerLink="/auth/login">Use password login</a></span>
    </app-face-scan-panel>
  </div>
</div>
